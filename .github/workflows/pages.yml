# Publishes the interactive map + all exports to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# Result: https://<owner>.github.io/<repo>/  (redirects to /web/)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build && npm test
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html web dist docs data README.md LICENSE _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
